name: CLI Lint

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'packages/cli/**'
      - '.github/workflows/cli-lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'packages/cli/**'
      - '.github/workflows/cli-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: packages/cli/package-lock.json

    - name: Install dependencies
      working-directory: packages/cli
      run: npm ci

    - name: Run linter
      working-directory: packages/cli
      run: npm run lint
